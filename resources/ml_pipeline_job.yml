resources:
  jobs:
    ml_pipeline:
      name: hackbricks_student_dropout_${bundle.target}
      description: "End-to-end student dropout prediction pipeline (Bronze → Silver → Train → Register → Fairness → Gold)"

      tags:
        project: HackBricks
        env: ${bundle.target}

      job_clusters:
        - job_cluster_key: ml_cluster
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "m5d.large"
            num_workers: 2
            spark_env_vars:
              PYSPARK_PYTHON: /databricks/python3/bin/python3

      tasks:
        - task_key: ingest_bronze
          description: "Ingest UCI Dropout CSV → Bronze Delta Table in Unity Catalog"
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: ../src/01_ingest_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              schema_bronze: ${var.schema_bronze}

        - task_key: transform_silver
          description: "Clean Bronze → Silver + Feature Engineering + Financial Stress Index"
          depends_on:
            - task_key: ingest_bronze
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: ../src/02_transform_silver.py
            base_parameters:
              catalog: ${var.catalog}
              schema_bronze: ${var.schema_bronze}
              schema_silver: ${var.schema_silver}

        - task_key: train_models
          description: "Train Logistic Regression + XGBoost, log metrics to MLflow"
          depends_on:
            - task_key: transform_silver
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: ../src/03_train_models.py
            base_parameters:
              catalog: ${var.catalog}
              schema_silver: ${var.schema_silver}
              experiment_name: ${var.experiment_name}
              model_name: ${var.model_name}

        - task_key: register_model
          description: "Compare runs, promote best model to Unity Catalog Model Registry"
          depends_on:
            - task_key: train_models
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: ../src/04_register_model.py
            base_parameters:
              catalog: ${var.catalog}
              experiment_name: ${var.experiment_name}
              model_name: ${var.model_name}

        - task_key: fairness_shap
          description: "Fairlearn audit + SHAP explainability on Champion model"
          depends_on:
            - task_key: register_model
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: ../src/05_fairness_shap.py
            base_parameters:
              catalog: ${var.catalog}
              schema_silver: ${var.schema_silver}
              model_name: ${var.model_name}

        - task_key: gold_output
          description: "Write predictions + SHAP scores + risk tiers → Gold Delta Tables"
          depends_on:
            - task_key: fairness_shap
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: ../src/06_gold_output.py
            base_parameters:
              catalog: ${var.catalog}
              schema_silver: ${var.schema_silver}
              schema_gold: ${var.schema_gold}
              model_name: ${var.model_name}
