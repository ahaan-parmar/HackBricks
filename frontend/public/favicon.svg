<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Mortarboard top (diamond) -->
  <polygon points="16,7 27,13 16,19 5,13" fill="white"/>
  <!-- Cap body -->
  <path d="M10,15.5 L10,20.5 C10,23.2 12.7,25.5 16,25.5 C19.3,25.5 22,23.2 22,20.5 L22,15.5 L16,19 Z" fill="rgba(255,255,255,0.72)"/>
  <!-- Tassel string -->
  <line x1="27" y1="13" x2="27" y2="21.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tassel ball -->
  <circle cx="27" cy="23" r="1.8" fill="#FDE68A"/>
</svg>
